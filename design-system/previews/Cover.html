<!doctype html>
<html lang="pt-BR" data-theme="bege">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="lib/react.production.min.js"></script><script src="lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script>
<meta charset="utf-8">
<title>Matheus Freitas</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--sand); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .deep { fill:var(--sand-3); }
  .brand { fill:var(--terracota); }
  .ink { fill:var(--ink); }
  .paper { fill:var(--paper); }
  .blk { rx:var(--radius-md); }
  .tab { rx:var(--radius-sm); }
  .dot { fill:var(--ink-faint); }
  .pin { fill:var(--terracota-strong); }
  .ring { fill:none; stroke:var(--terracota-strong); stroke-width:1; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:96px; line-height:.92; font-weight:600; letter-spacing:-.045em; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 3px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      sand-3 224x244 with a 96x24 folder tab (the Skills folder) · terracota 128x200 bled off the top (the signature, largest hue) · ink 128x80 · paper 96x212 bled off the right edge — about 40% of 960x300
  arrangement one folder-shaped slab on the left, terracota slab with an ink foot in the middle, a paper sheet sliding out at the right; bottoms on one line space-4 above the edge, space-4 gutters
  pattern     dot grid, from "precise, technical, mono": 35 dots at a space-4 pitch inside the folder, one grid point replaced by the terracota pin of the Coordinates card
  scales      sides in space-4 multiples; gutters space-4; pitch space-4; corners radius-md, tab radius-sm
-->
<rect class="deep tab" x="16" y="24" width="96" height="32" rx="6"/>
<rect class="deep blk" x="16" y="40" width="224" height="244" rx="12"/>
<rect class="brand blk" x="256" y="-12" width="128" height="200" rx="12"/>
<rect class="ink blk" x="256" y="204" width="128" height="80" rx="12"/>
<rect class="paper blk" x="400" y="72" width="96" height="212" rx="12"/>
<circle class="dot" cx="104" cy="168" r="1.4"/>
<circle class="dot" cx="104" cy="184" r="1.4"/>
<circle class="dot" cx="104" cy="200" r="1.4"/>

<circle class="dot" cx="120" cy="200" r="1.4"/>
<circle class="dot" cx="120" cy="216" r="1.4"/>
<circle class="dot" cx="120" cy="232" r="1.4"/>
<circle class="dot" cx="120" cy="248" r="1.4"/>
<circle class="dot" cx="136" cy="168" r="1.4"/>
<circle class="dot" cx="136" cy="184" r="1.4"/>
<circle class="dot" cx="136" cy="200" r="1.4"/>
<circle class="dot" cx="136" cy="216" r="1.4"/>
<circle class="dot" cx="136" cy="232" r="1.4"/>
<circle class="dot" cx="136" cy="248" r="1.4"/>
<circle class="dot" cx="152" cy="168" r="1.4"/>
<circle class="dot" cx="152" cy="184" r="1.4"/>
<circle class="dot" cx="152" cy="216" r="1.4"/>
<circle class="dot" cx="152" cy="232" r="1.4"/>
<circle class="dot" cx="152" cy="248" r="1.4"/>
<circle class="dot" cx="168" cy="168" r="1.4"/>
<circle class="dot" cx="168" cy="184" r="1.4"/>
<circle class="dot" cx="168" cy="200" r="1.4"/>
<circle class="dot" cx="168" cy="216" r="1.4"/>
<circle class="dot" cx="168" cy="232" r="1.4"/>
<circle class="dot" cx="168" cy="248" r="1.4"/>
<circle class="dot" cx="184" cy="168" r="1.4"/>

<circle class="dot" cx="184" cy="200" r="1.4"/>

<circle class="ring" cx="152" cy="200" r="8"/>
<circle class="pin" cx="152" cy="200" r="3.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Matheus Freitas</h1>
<p class="tag">Tecnologia é meio, não objetivo.</p>
</div>
</div>
</body>
</html>

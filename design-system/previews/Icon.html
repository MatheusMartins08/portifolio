<!doctype html>
<html lang="pt-BR" data-theme="bege">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="lib/react.production.min.js"></script><script src="lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><meta charset="utf-8"><title>Icon — preview</title>
<style>
  .pv { padding: 28px; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .stack { display: grid; gap: 20px; }
  .cap { font: 500 10px/14px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: var(--radius-sm); background: var(--paper); color: var(--ink); }
  .cell span { font: 400 10px/1 var(--font-mono); color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var M = window.MF, h = React.createElement, F = React.Fragment;
  var names = ['arrow-up-right','arrow-down','arrow-right','arrow-left','chevron-down','plus','close','check','globe','mail','chat','code','user','pin','folder','terminal','file','alert','menu','link'];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'grid' }, names.map(function (n) {
    return h('div', { key: n, className: 'cell' }, h(M.Icon, { name: n, size: 20 }), h('span', null, n));
  })));
</script>
</body>
</html>

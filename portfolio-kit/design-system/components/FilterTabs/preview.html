<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>FilterTabs — preview</title>
<style>
  .pv { padding: 28px; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .stack { display: grid; gap: 20px; }
  .cap { font: 500 10px/14px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; }

</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var M = window.MF, h = React.createElement, F = React.Fragment;
  function Demo() {
    var s = React.useState('pro');
    return h(M.FilterTabs, { label: 'Tipo de experiência', value: s[0], onChange: s[1], options: [{ id: 'pro', label: 'Profissional', count: 2 }, { id: 'acad', label: 'Acadêmica', count: 2 }, { id: 'cert', label: 'Cursos & Certificações', count: 0 }] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

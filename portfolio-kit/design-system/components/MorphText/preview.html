<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>MorphText — preview</title>
<style>
  .pv { padding: 28px; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .stack { display: grid; gap: 20px; }
  .cap { font: 500 10px/14px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; }

</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var M = window.MF, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'stack' },
    h('p', { className: 'cap' }, 'a cada 3,4 s as letras em comum migram para a nova frase'),
    h(M.MorphText, { phrases: ['Fullstack Developer', 'Produtos Digitais', 'Automações & IA'], interval: 2600 })));
</script>
</body>
</html>

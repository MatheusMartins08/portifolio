<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Reveal — preview</title>
<style>
  .pv { padding: 28px; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .stack { display: grid; gap: 20px; }
  .cap { font: 500 10px/14px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .box { padding: 20px; background: var(--paper); border-radius: var(--radius-md); border: 1px solid var(--hairline); min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; }
  .box b { font: 500 16px/22px var(--font-sans); }
</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var M = window.MF, h = React.createElement, F = React.Fragment;
  function Demo() {
    var k = React.useState(0);
    return h('div', { className: 'stack' },
      h('div', null, h(M.Button, { variant: 'ghost', size: 'sm', onClick: function () { k[1](k[0] + 1); } }, 'Repetir entrada')),
      h('div', { key: k[0], className: 'cols' },
        ['up', 'fade', 'blur', 'clip'].map(function (v, i) {
          return h(M.Reveal, { key: v, variant: v, delay: i * 90, className: 'box' }, h('span', { className: 'cap' }, v), h('b', null, 'Label → título → conteúdo'));
        })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

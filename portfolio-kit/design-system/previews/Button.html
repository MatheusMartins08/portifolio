<!doctype html>
<html lang="pt-BR" data-theme="bege">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="lib/react.production.min.js"></script><script src="lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><meta charset="utf-8"><title>Button — preview</title>
<style>
  .pv { padding: 28px; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .stack { display: grid; gap: 20px; }
  .cap { font: 500 10px/14px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; }

</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var M = window.MF, h = React.createElement, F = React.Fragment;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'stack' },
    h('div', { className: 'row' },
      h(M.Button, { variant: 'primary', icon: 'arrow-up-right' }, "Let's talk"),
      h(M.Button, { variant: 'solid', icon: 'arrow-right' }, 'Ver projetos'),
      h(M.Button, { variant: 'ghost', icon: 'arrow-down' }, 'Download CV'),
      h(M.Button, { variant: 'primary', loading: true }, 'Enviando…')),
    h('div', { className: 'row' },
      h(M.Button, { variant: 'primary', size: 'sm', icon: 'arrow-right' }, 'Enviar'),
      h(M.Button, { variant: 'ghost', size: 'sm', icon: 'arrow-up-right' }, 'GitHub'),
      h(M.Button, { variant: 'solid', size: 'lg', icon: 'arrow-up-right' }, 'View my GitHub'))));
</script>
</body>
</html>

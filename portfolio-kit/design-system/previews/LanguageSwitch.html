<!doctype html>
<html lang="pt-BR" data-theme="bege">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><script src="lib/react.production.min.js"></script><script src="lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script><meta charset="utf-8"><title>LanguageSwitch — preview</title>
<style>
  .pv { padding: 28px; box-sizing: border-box; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .stack { display: grid; gap: 20px; }
  .cap { font: 500 10px/14px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 10px; }

</style>
</head>
<body>
<div id="root" class="pv"></div>
<script>
  var M = window.MF, h = React.createElement, F = React.Fragment;
  function Demo() {
    var s = React.useState('PT');
    return h('div', { className: 'row', style: { alignItems: 'flex-start', gap: '28px' } },
      h(M.LanguageSwitch, { value: s[0], onChange: s[1] }),
      h('p', { className: 'cap', style: { marginTop: '12px' } }, 'idioma: ' + s[0]));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
  setTimeout(function () { var b = document.querySelector('.mf-lang__btn'); if (b) b.click(); }, 300);
</script>
</body>
</html>
